name: Package Validation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package
        run: |
          jq empty package.json
          test "$(jq -r '.name' package.json)" = "com.jeomseon.unity.reactive"
          test -f README.md
          test -f CHANGELOG.md
          test -f LICENSE.md
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$(jq -r '.version' package.json)" = "${GITHUB_REF_NAME#v}"
